meta:
  name: EGPROC
  link: https://egproc.org

# Logo artwork: full logo is the original WordPress logo unchanged;
# mark is a crop of just the EGPROC letters from it (taglines removed)
# for the navbar; icon is the "E" glyph for the favicon. All three are
# black on transparent.
logo:
  images:
    mark:
      path: images/brand/egproc-mark.png
      alt: EGPROC
    full:
      path: images/brand/egproc-logo.png
      alt: "EGPROC — European Group of Process Tracing Studies"
    icon: images/brand/favicon.png
  small: icon
  medium: mark
  large: full

# The logo is pure black, so the palette is near-black/white with warm
# grays and one accent -- a deep teal, deliberately distinct from EADM's
# red. Links use the deep teal so text/link pairs meet WCAG AA.
color:
  palette:
    egproc-teal: "#0f6e6e"
    egproc-ink: "#1d1d1f"
    egproc-charcoal: "#3a3a3d"
    egproc-gray: "#5f5f63"
    egproc-paper: "#f6f5f3"
  primary: egproc-teal
  secondary: egproc-gray
  foreground: egproc-charcoal
  background: "#ffffff"

typography:
  fonts:
    - family: Inter
      source: google
      weight: [400, 500, 600, 700]
      style: [normal, italic]
    # Geometric sans echoing the logo's lettering.
    - family: Outfit
      source: google
      weight: [500, 600, 700]
  base:
    family: Inter
    size: 1rem
    line-height: 1.65
  headings:
    family: Outfit
    weight: 600
    line-height: 1.2
    color: egproc-ink
  link:
    color: primary
    weight: 500
